[metadata]
name = pwa-next
version = attr: pwa.__version__
description = Web administration for perfSONAR pSConfig meshes
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/osg-htc/pwa-next
license = Apache-2.0
license_files = LICENSE

[options]
packages = find:
python_requires = >=3.9
include_package_data = True
install_requires =
    flask>=2.0
    sqlalchemy>=1.4,<2.0
    alembic>=1.7
    jsonschema>=3.2

[options.packages.find]
include =
    pwa
    pwa.*

[options.package_data]
pwa =
    specs/*.json
    specs/tests/*.json
    specs/archivers/*.json
pwa.web =
    templates/*.html
    static/*
    static/brand/*

[options.entry_points]
console_scripts =
    pwa = pwa.cli:main
