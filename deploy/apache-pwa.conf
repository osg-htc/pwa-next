# Apache configuration SKETCH for pwa-next.  NOT YET RUN ANYWHERE: treat every
# line as a starting point, especially the OIDC settings.
#
# Packages (EL9): httpd mod_ssl python3-mod_wsgi mod_auth_openidc
#                 python3-flask python3-sqlalchemy python3-psycopg2 python3-jsonschema
#
# Layout assumed:
#   /usr/lib/pwa/            the `pwa` package and deploy/pwa.wsgi
#   /etc/pwa/pwa.env         settings (PWA_AUTH=oidc, PWA_DATABASE_URL=postgresql://...,
#                            PWA_PUBLISH_DIR=/var/lib/pwa/pub, PWA_PUBLIC_URL=https://HOST/pub,
#                            PWA_ADMINS=<your CILogon subject>, PWA_SECRET_KEY=<random>)
#   /var/lib/pwa/pub/        published files, writable by the WSGI user

# --- what toolkits read: plain files, no login, no application -------------
AliasMatch ^/pub/config/?$ /var/lib/pwa/pub/index.json
Alias /pub/config/ /var/lib/pwa/pub/config/
Alias /pub/auto/   /var/lib/pwa/pub/auto/
<Directory /var/lib/pwa/pub>
    Require all granted
    Options None
    ForceType application/json
    Header set Cache-Control "no-cache"
</Directory>

# --- the application ---------------------------------------------------------
WSGIDaemonProcess pwa user=pwa group=pwa processes=2 threads=8 python-path=/usr/lib/pwa
WSGIScriptAlias / /usr/lib/pwa/deploy/pwa.wsgi process-group=pwa application-group=%{GLOBAL}
<Directory /usr/lib/pwa/deploy>
    Require all granted
</Directory>

# --- sign-in through CILogon (institution logins, InCommon and eduGAIN) -----
# Register a client at https://cilogon.org/oauth2/register with the redirect URI below.
OIDCProviderMetadataURL https://cilogon.org/.well-known/openid-configuration
OIDCClientID            REPLACE_ME
OIDCClientSecret        REPLACE_ME
OIDCRedirectURI         https://HOST/oidc/redirect
OIDCCryptoPassphrase    REPLACE_WITH_A_LONG_RANDOM_STRING
OIDCScope               "openid email profile org.cilogon.userinfo"
OIDCRemoteUserClaim     sub
OIDCPassClaimsAs        environment

<Location />
    AuthType openid-connect
    Require valid-user
</Location>
<Location /pub/>
    AuthType None
    Require all granted
</Location>
<Location /static/>
    AuthType None
    Require all granted
</Location>

# The application reads REMOTE_USER and the OIDC_CLAIM_name, OIDC_CLAIM_email and
# OIDC_CLAIM_idp_name variables.  If CILogon names a claim differently, point
# PWA_OIDC_NAME / PWA_OIDC_EMAIL / PWA_OIDC_IDP at the right variable.
